name: Validate CiteSkill
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: git diff --exit-code -- plugins/citeskill/scripts claude-plugin/scripts
      - run: node dist/cli.js validate --trailers
